[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chebyshev-spectral"
version = "0.1.0"
description = "Python port of the Chebyshev pseudospectral MATLAB routines"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "mpmath>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["chebyshev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
